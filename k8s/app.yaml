apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-analyzer-alerting
  labels:
    app: log-analyzer-alerting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-analyzer-alerting
  template:
    metadata:
      labels:
        app: log-analyzer-alerting
    spec:
      containers:
        - name: api
          image: log-analyzer-alerting:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: log-analyzer-alerting
spec:
  selector:
    app: log-analyzer-alerting
  ports:
    - port: 80
      targetPort: 8080
